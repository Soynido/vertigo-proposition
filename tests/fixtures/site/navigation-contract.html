<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation contract</title><style>body{margin:0;font:20px sans-serif}nav{padding:20px}#banner{position:fixed;inset:0;background:#233e38;color:white;z-index:100;padding:30px}main{height:14000px;background:linear-gradient(#f5edda,#d5e5df)}[hidden]{display:none!important}#bottom{position:absolute;top:13700px}#panel{height:150px;overflow:auto;border:2px solid}#panel>div{height:800px}</style>
<nav><button aria-expanded="false" aria-controls="menu" onclick="let v=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',v);document.getElementById('menu').hidden=!v">Menu</button><div id="menu" hidden><a href="/about.html">Notre équipe</a><button aria-expanded="false" aria-controls="nested" onclick="let v=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',v);document.getElementById('nested').hidden=!v">Détails</button><div id="nested" hidden><a href="/nested.html">La méthode</a></div></div><button aria-expanded="false" aria-controls="peer" onclick="if(!document.getElementById('menu').hidden)document.getElementById('peer').textContent='OVERLAPPING-PEER-MENUS';let v=this.getAttribute('aria-expanded')!=='true';this.setAttribute('aria-expanded',v);document.getElementById('peer').hidden=!v">Autre menu</button><div id="peer" hidden>Un autre parcours</div></nav>
<main><h1>Une vraie navigation</h1><div id="panel"><div>Contenu interne<div style="padding-top:650px">Fin du panneau</div></div></div><p id="bottom">BOTTOM-NAVIGATION-CONTRACT</p></main>
<script>setTimeout(()=>{let b=document.createElement('section');b.id='banner';b.setAttribute('role','dialog');b.setAttribute('aria-modal','true');b.innerHTML='<h2>Vos préférences</h2><button onclick="this.parentElement.remove()">Continuer sans accepter</button>';document.body.append(b)},350);addEventListener('scroll',()=>{if(scrollY>12500&&!document.getElementById('late-image')){let i=document.createElement('img');i.id='late-image';i.src='/assets/gallery.svg';i.alt='LATE-IMAGE';i.width=80;i.height=80;document.getElementById('bottom').append(i)}})</script>
</html>
