name: Tests and distributable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      PROPOSITION_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test.py
      - run: python scripts/check_distribution.py
  consumer-starter:
    runs-on: ubuntu-latest
    env:
      PROPOSITION_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements-presentations.lock
      - run: sudo .venv/bin/python -m playwright install-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-dejavu-core
      - name: Install into a consumer workspace with no checkout credentials
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-workspace"
          .venv/bin/python scripts/setup.py --workspace "$RUNNER_TEMP/consumer-workspace" --browser --with-upstream --with-presentations
          test -z "$(git status --porcelain --untracked-files=no)"
      - run: .venv/bin/python scripts/test.py test_setup.py
      - run: .venv/bin/python scripts/test.py test_presentation_probe.py
